<!DOCTYPE html>
<html>
<head>
  <title>Simple Background Changer</title>
</head>

<body>
  <button onclick="changeColor()">Change Color</button>
  <button onclick="changeBackgroundImage()">Change Background Image</button>
  <button onclick="resetBackground()">Return to Normal</button>

  <script>
    const originalColor = "white";
    const originalImage = "";

    function changeColor() {
      document.body.style.backgroundImage = "";
      document.body.style.backgroundColor = "blue";
    }

    function changeBackgroundImage() {
      document.body.style.backgroundColor = "";
      document.body.style.backgroundImage =
        "url('https://static.vecteezy.com/system/resources/previews/047/005/018/non_2x/big-tree-growing-in-the-grass-scientific-name-albizia-saman-common-name-rain-tree-photo.jpg')";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
    }

    function resetBackground() {
      document.body.style.backgroundColor = originalColor;
      document.body.style.backgroundImage = originalImage;
    }
  </script>
</body>
</html>
```

The main correction is that `changeBackgroundImage()` now actually exists and the **Return to Normal** button calls the correctly named `resetBackground()` function.
